# Publication initiale autorisée explicitement par le propriétaire le 2026-10-09.
# Le push déclenche le déploiement uniquement si ce workflow est modifié.
name: Publier la version navigateur (accord requis)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-pages.yml']
  workflow_dispatch:
    inputs:
      publish_approved:
        description: "J’autorise la publication de l’interface statique publique, sans fichiers commerciaux"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: semin-browser-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.publish_approved == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/build.mjs
      - name: Préparer uniquement l’interface autonome
        run: |
          mkdir -p _site
          cp web/SEMIN-Marketplace.html _site/index.html
          cp web/vendor/LICENSE-JSZip.txt _site/LICENSE-JSZip.txt
      - name: Vérifier la liste exacte des fichiers à publier
        run: |
          test "$(find _site -type f | wc -l)" -eq 2
          test -f _site/index.html
          test -f _site/LICENSE-JSZip.txt
          grep -q "connect-src 'none'" _site/index.html
          echo 'Publication : interface autonome et licence uniquement ; exemples fictifs intégrés.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier après accord explicite
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmer le lien publié
        run: echo 'URL déployée — ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
