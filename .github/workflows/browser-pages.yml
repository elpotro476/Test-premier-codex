# Publication initiale autorisée explicitement par le propriétaire le 2026-10-09.
# Le déploiement se lance manuellement après activation de Pages dans les paramètres.
name: Publier la version navigateur

on:
  workflow_dispatch:
  push:
    tags:
      - 'semin-pages-approved-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: semin-browser-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/build.mjs
      - name: Préparer uniquement l’interface autonome
        run: |
          mkdir -p _site
          cp web/SEMIN-Marketplace.html _site/index.html
          cp web/vendor/LICENSE-JSZip.txt _site/LICENSE-JSZip.txt
      - name: Vérifier la liste exacte des fichiers à publier
        run: |
          test "$(find _site -type f | wc -l)" -eq 2
          test -f _site/index.html
          test -f _site/LICENSE-JSZip.txt
          grep -q "connect-src 'none'" _site/index.html
          echo 'Publication : interface autonome et licence uniquement ; exemples fictifs intégrés.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier après accord explicite
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Vérifier la page HTTPS effectivement publiée
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 "$PAGE_URL" -o /tmp/semin-published.html
          cmp _site/index.html /tmp/semin-published.html
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les outils de vérification uniquement sur le runner
        run: |
          python -m pip install -r requirements.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Tester le parcours tactile sur le véritable site HTTPS
        env:
          SEMIN_WEB_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m unittest discover -s web/tests -v
      - name: Confirmer le lien publié
        run: echo 'URL déployée — ${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
