name: Version navigateur

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/browser.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Construire le fichier HTML autonome
        run: node web/build.mjs
      - name: Installer les outils de test uniquement
        run: |
          python -m pip install -r requirements.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Tester les imports, mappings, exports et confidentialité
        run: python -m unittest discover -s web/tests -v
      - name: Préparer le ZIP navigateur
        shell: python
        run: |
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('SEMIN-Marketplace-Navigateur.zip', 'w', ZIP_DEFLATED) as archive:
              archive.write('web/SEMIN-Marketplace.html', 'SEMIN-Marketplace.html')
              archive.write('web/GUIDE-VISUELS-URL.md', 'GUIDE-VISUELS-URL.txt')
              archive.write('web/GUIDE-ANDROID-WINDOWS.md', 'GUIDE-ANDROID-WINDOWS.txt')
              archive.write('web/GUIDE-STOCKAGE-V3.2.md', 'GUIDE-STOCKAGE-V3.2.txt')
              archive.write('web/GUIDE-V3.2-CHATGPT.md', 'GUIDE-V3.2-CHATGPT.txt')
              archive.write('web/GUIDE-ONEBASE-CASTORAMA.md', 'GUIDE-ONEBASE-CASTORAMA.txt')
              archive.write('web/ARCHITECTURE-ONEBASE-CASTORAMA.md', 'ARCHITECTURE-ONEBASE-CASTORAMA.txt')
              archive.write('web/vendor/LICENSE-JSZip.txt', 'LICENSE-JSZip.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: SEMIN-Marketplace-Navigateur
          path: SEMIN-Marketplace-Navigateur.zip
          if-no-files-found: error
          retention-days: 90
