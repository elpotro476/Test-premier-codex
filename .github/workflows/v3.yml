name: V3.1 — Base et interface

on:
  push:
    branches: [main]
    paths: ["v3/**", ".github/workflows/v3.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: semin_v3_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Appliquer le contrat Auth de test et les migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -U postgres -d semin_v3_test -f v3/tests/auth-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -U postgres -d semin_v3_test -f v3/supabase/migrations/001_catalogue.sql
          psql -X -v ON_ERROR_STOP=1 -U postgres -d semin_v3_test -f v3/supabase/migrations/002_commands.sql
      - name: Vérifier réellement PostgreSQL, RLS, rôles et commandes
        run: python -m unittest discover -s v3/tests -p test_postgres.py -v
      - name: Installer les outils de test sur le runner seulement
        run: |
          python -m pip install -r requirements.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Construire V3 fictive et V2
        run: |
          node v3/build.mjs
          node web/build.mjs
      - name: Tester interface V3 et non-régression V1/V2
        run: |
          python -m unittest discover -s v3/tests -p test_frontend.py -v
          python -m unittest discover -s web/tests -v
      - name: Préparer la démonstration sans projet ni secret
        shell: python
        run: |
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('SEMIN-V3.1-Demo.zip','w',ZIP_DEFLATED) as z:
              z.write('v3/dist/index.html','SEMIN-V3.1-Demo.html')
              for name in ['README.md','ARCHITECTURE.md','GUIDE-SUPABASE.md','VALIDATION.md']:
                  z.write('v3/'+name,name)
      - uses: actions/upload-artifact@v4
        with:
          name: SEMIN-V3.1-Demo
          path: SEMIN-V3.1-Demo.zip
          if-no-files-found: error
          retention-days: 90
